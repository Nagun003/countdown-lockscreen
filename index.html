<!DOCTYPE html>
<html lang="en" class="h-full bg-[#050507] text-slate-100 select-none overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minimalist Countdown Lock Screen</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            oled: '#050507',
            skyCalm: '#38bdf8',
            amberFocus: '#f59e0b',
            coralUrgent: '#f43f5e',
          }
        }
      }
    }
  </script>

  <style>
    /* Theme State Colors */
    :root {
      --accent-color: #f59e0b;
      --accent-rgb: 245, 158, 11;
      --accent-glow: rgba(245, 158, 11, 0.25);
    }

    .theme-calm {
      --accent-color: #38bdf8;
      --accent-rgb: 56, 189, 248;
      --accent-glow: rgba(56, 189, 248, 0.2);
    }

    .theme-focus {
      --accent-color: #f59e0b;
      --accent-rgb: 245, 158, 11;
      --accent-glow: rgba(245, 158, 11, 0.25);
    }

    .theme-urgent {
      --accent-color: #f43f5e;
      --accent-rgb: 244, 63, 94;
      --accent-glow: rgba(244, 63, 94, 0.35);
    }

    /* Glassmorphism primitives */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
    }

    .glass-card-hover:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Radial Breathing Ambient Glow */
    .ambient-glow {
      background: radial-gradient(circle at 50% 40%, var(--accent-glow) 0%, rgba(5, 5, 7, 0.98) 75%);
      transition: background 0.8s ease;
    }

    /* Hold to Focus overlay state */
    .focus-active #essential-ui-elements {
      opacity: 0.03;
      filter: blur(8px);
      pointer-events: none;
    }

    .focus-active #focus-timer-display {
      transform: scale(1.15);
      color: #ffffff;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body class="h-full flex flex-col items-center justify-between font-sans antialiased bg-[#050507] text-slate-100 select-none p-3 md:p-6 min-h-screen theme-focus">

  <!-- TOP STUDIO CONTROLS BAR -->
  <header class="w-full max-w-5xl p-3 bg-slate-900/80 border border-slate-800 backdrop-blur-xl rounded-2xl shadow-xl flex flex-wrap items-center justify-between gap-3 z-40">
    <!-- Brand / Title -->
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-[var(--accent-color)] shadow-[0_0_12px_var(--accent-color)] transition-all duration-500"></div>
      <div>
        <h1 class="font-bold text-xs md:text-sm tracking-wide text-slate-100 uppercase flex items-center gap-2">
          DEADLINE LOCK SCREEN <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300">OLED MINIMAL</span>
        </h1>
        <p class="text-[11px] text-slate-400">Clean Deadline Tracker & 3:2 Cover Generator</p>
      </div>
    </div>

    <!-- Mode Pills + Controls -->
    <div class="flex flex-wrap items-center gap-2">
      <!-- Urgency Mode Pills -->
      <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-[11px] font-mono">
        <button onclick="setUrgencyMode('calm')" id="mode-calm" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-skyCalm transition-colors">14d Calm</button>
        <button onclick="setUrgencyMode('focus')" id="mode-focus" class="px-2.5 py-1 rounded-lg text-amberFocus font-bold bg-slate-800 border border-slate-700">48h Focus</button>
        <button onclick="setUrgencyMode('urgent')" id="mode-urgent" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-coralUrgent transition-colors">6h Urgent</button>
      </div>

      <!-- Edit Config Drawer Toggle -->
      <button onclick="toggleEditDrawer()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-200 text-xs font-medium flex items-center gap-1.5 transition-colors">
        ✏️ Edit Goal
      </button>

      <!-- EXPORT 3:2 COVER IMAGE BUTTON -->
      <button onclick="exportSubmissionCover()" class="px-4 py-2 bg-gradient-to-r from-sky-400 to-emerald-400 hover:from-sky-300 hover:to-emerald-300 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-sky-500/10 flex items-center gap-2 transition-all active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Export 3:2 Cover PNG
      </button>
    </div>
  </header>

  <!-- EDITABLE GOAL DRAWER -->
  <div id="edit-drawer" class="w-full max-w-5xl mt-2 p-4 bg-slate-900/95 border border-slate-800 rounded-2xl text-xs font-mono hidden z-30 transition-all">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div>
        <label class="block text-slate-400 mb-1">PROJECT TITLE</label>
        <input type="text" id="cfg-title" value="GATE 2027 // AI & ML SPRINT" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-slate-100" oninput="updateGoalConfig()">
      </div>
      <div>
        <label class="block text-slate-400 mb-1">TARGET DEADLINE</label>
        <input type="datetime-local" id="cfg-target" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-slate-100" onchange="updateGoalConfig()">
      </div>
      <div class="col-span-2 grid grid-cols-3 gap-2">
        <div>
          <label class="block text-slate-400 mb-1">MILESTONE 1</label>
          <input type="text" id="cfg-m1" value="Core Syllabus" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-slate-100" oninput="updateGoalConfig()">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">MILESTONE 2</label>
          <input type="text" id="cfg-m2" value="Mock Series" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-slate-100" oninput="updateGoalConfig()">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">MILESTONE 3</label>
          <input type="text" id="cfg-m3" value="Final Revision" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-slate-100" oninput="updateGoalConfig()">
        </div>
      </div>
    </div>
  </div>

  <!-- PHONE FRAME SHOWCASE CONTAINER -->
  <div class="relative my-auto py-4 flex items-center justify-center w-full">
    
    <!-- Minimalist Phone Frame (360px x 760px) -->
    <main class="relative w-[360px] h-[760px] rounded-[48px] bg-oled border-[8px] border-slate-800/90 shadow-[0_25px_60px_rgba(0,0,0,0.95)] ring-1 ring-slate-800 overflow-hidden flex flex-col justify-between p-6 transition-all duration-500">
      
      <!-- Breathing Ambient Radial Glow -->
      <div id="ambient-bg" class="absolute inset-0 ambient-glow pointer-events-none transition-all duration-700"></div>

      <!-- iOS Style Dynamic Status Bar -->
      <div class="relative z-20 w-full flex items-center justify-between text-slate-400 text-xs font-medium px-1 pt-1">
        <span id="lock-time" class="font-semibold text-slate-200">09:41</span>
        <!-- Camera pill -->
        <div class="w-20 h-4 bg-black rounded-full border border-slate-900"></div>
        <div class="flex items-center gap-1.5 text-[11px]">
          <span>5G</span>
          <div class="w-4 h-2 border border-slate-400 rounded-xs p-0.5 flex items-center">
            <div class="h-full w-full bg-slate-200"></div>
          </div>
        </div>
      </div>

      <!-- Dynamic Date Line -->
      <div class="relative z-20 text-center mt-3">
        <span id="lock-date" class="text-[11px] font-semibold tracking-widest text-slate-400 uppercase">
          MONDAY, NOV 23
        </span>
      </div>

      <!-- CENTER DISPLAY: BOLD MINIMAL COUNTDOWN + PROGRESS BAR -->
      <div class="relative z-20 my-auto flex flex-col items-center justify-center text-center py-4">
        
        <!-- Large Minimal Countdown Digits -->
        <div id="focus-timer-display" class="transition-all duration-500 my-2">
          <div class="flex items-baseline justify-center gap-1 font-mono font-extrabold tracking-tight text-slate-100">
            <span id="digit-days" class="text-4xl md:text-5xl">01</span><span class="text-xs text-slate-400 font-sans mr-2">d</span>
            <span id="digit-hours" class="text-4xl md:text-5xl">23</span><span class="text-xs text-slate-400 font-sans mr-2">h</span>
            <span id="digit-mins" class="text-4xl md:text-5xl">59</span><span class="text-xs text-slate-400 font-sans mr-2">m</span>
            <span id="digit-secs" class="text-2xl md:text-3xl text-[var(--accent-color)]">48</span><span class="text-xs text-[var(--accent-color)] font-sans">s</span>
          </div>
        </div>

        <!-- Single Razor-Thin Progress Bar -->
        <div id="essential-ui-elements" class="w-full transition-all duration-500 space-y-4 mt-2">
          <div class="w-full max-w-[240px] mx-auto space-y-1.5">
            <div class="w-full h-1 bg-slate-800/80 rounded-full overflow-hidden p-0.2">
              <div id="progress-bar-fill" class="h-full bg-[var(--accent-color)] rounded-full transition-all duration-500" style="width: 65%;"></div>
            </div>
            <div class="flex justify-between items-center text-[10px] font-mono text-slate-400 px-0.5">
              <span id="pct-label">65% Elapsed</span>
              <span id="urgency-badge" class="px-2 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-[9px] font-bold text-[var(--accent-color)]">48H FOCUS</span>
            </div>
          </div>

          <!-- Goal Title & Target Subtitle -->
          <div class="space-y-1">
            <h2 id="display-goal-title" class="text-sm font-bold text-slate-100 tracking-wide uppercase">
              GATE 2027 // AI & ML SPRINT
            </h2>
            <p id="display-target-sub" class="text-[11px] text-slate-400 font-mono">
              Target: Nov 25, 2026 • 14:30 IST
            </p>
          </div>
        </div>

      </div>

      <!-- BOTTOM SECTION: MILESTONES & HOLD TO FOCUS BUTTON -->
      <div id="bottom-ui-elements" class="relative z-20 space-y-4 pt-2 pb-1 transition-all duration-500">
        
        <!-- 3 Glassmorphic Milestone Pills -->
        <div class="space-y-2">
          <button onclick="toggleMilestone('m1')" id="m1-pill" class="w-full glass-card glass-card-hover p-2.5 rounded-2xl flex items-center justify-between text-left transition-all active:scale-[0.98]">
            <div class="flex items-center gap-2.5">
              <div id="m1-check" class="w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center text-[10px]"></div>
              <span id="m1-text" class="text-xs font-medium text-slate-300">1. Core Syllabus</span>
            </div>
            <span id="m1-status" class="text-[10px] font-mono text-slate-500">Pending</span>
          </button>

          <button onclick="toggleMilestone('m2')" id="m2-pill" class="w-full glass-card glass-card-hover p-2.5 rounded-2xl flex items-center justify-between text-left transition-all active:scale-[0.98]">
            <div class="flex items-center gap-2.5">
              <div id="m2-check" class="w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center text-[10px]"></div>
              <span id="m2-text" class="text-xs font-medium text-slate-300">2. Mock Series</span>
            </div>
            <span id="m2-status" class="text-[10px] font-mono text-slate-500">Pending</span>
          </button>

          <button onclick="toggleMilestone('m3')" id="m3-pill" class="w-full glass-card glass-card-hover p-2.5 rounded-2xl flex items-center justify-between text-left transition-all active:scale-[0.98]">
            <div class="flex items-center gap-2.5">
              <div id="m3-check" class="w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center text-[10px]"></div>
              <span id="m3-text" class="text-xs font-medium text-slate-300">3. Final Revision</span>
            </div>
            <span id="m3-status" class="text-[10px] font-mono text-slate-500">Pending</span>
          </button>
        </div>

        <!-- Hold to Focus Pill Button -->
        <div class="flex justify-center pt-1">
          <button 
            id="focus-btn"
            class="px-5 py-2 rounded-full glass-card hover:bg-white/10 border border-white/10 text-slate-300 text-[11px] font-medium tracking-wide flex items-center gap-2 cursor-pointer transition-all active:scale-95"
            onmousedown="startFocusHold()"
            onmouseup="endFocusHold()"
            onmouseleave="endFocusHold()"
            ontouchstart="startFocusHold()"
            ontouchend="endFocusHold()"
          >
            <span class="w-1.5 h-1.5 rounded-full bg-[var(--accent-color)]"></span>
            <span>Hold to Focus</span>
          </button>
        </div>

      </div>

      <!-- Pure Lock Bar -->
      <div class="relative z-20 w-32 h-1 bg-slate-700/60 rounded-full mx-auto mt-2"></div>

    </main>

  </div>

  <!-- OFFSCREEN CANVAS FOR EXPORTING 3:2 SUBMISSION COVER (1500x1000) -->
  <canvas id="exportCanvas" width="1500" height="1000" class="hidden"></canvas>

  <!-- JAVASCRIPT APP LOGIC -->
  <script>
    /* STATE */
    let currentMode = 'focus';
    let milestones = { m1: false, m2: false, m3: false };
    
    // Set initial target to 48 hours from now
    const now = new Date();
    const defaultTarget = new Date(now.getTime() + (48 * 60 * 60 * 1000));
    
    const formatForInput = (d) => {
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };
    document.getElementById('cfg-target').value = formatForInput(defaultTarget);

    /* TIMER LOOP */
    function updateCountdown() {
      const currentNow = new Date();
      
      // Update Lock Screen Top Clock & Date
      const hoursStr = String(currentNow.getHours()).padStart(2, '0');
      const minsStr = String(currentNow.getMinutes()).padStart(2, '0');
      document.getElementById('lock-time').innerText = `${hoursStr}:${minsStr}`;
      
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('lock-date').innerText = currentNow.toLocaleDateString('en-US', options).toUpperCase();

      const targetStr = document.getElementById('cfg-target').value;
      const targetDate = new Date(targetStr || defaultTarget);

      const diff = Math.max(0, targetDate.getTime() - currentNow.getTime());
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('digit-days').innerText = String(days).padStart(2, '0');
      document.getElementById('digit-hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('digit-mins').innerText = String(minutes).padStart(2, '0');
      document.getElementById('digit-secs').innerText = String(seconds).padStart(2, '0');

      // Auto Urgency state if user hasn't forced preset
      const daysRem = diff / (1000 * 60 * 60 * 24);
      if (daysRem <= 1) setUrgencyMode('urgent', false);
      else if (daysRem <= 7) setUrgencyMode('focus', false);
      else setUrgencyMode('calm', false);

      requestAnimationFrame(updateCountdown);
    }

    function setUrgencyMode(mode, manual = true) {
      currentMode = mode;
      document.body.classList.remove('theme-calm', 'theme-focus', 'theme-urgent');
      document.body.classList.add(`theme-${mode}`);

      // Update Header Pills active state
      ['calm', 'focus', 'urgent'].forEach(m => {
        const btn = document.getElementById(`mode-${m}`);
        if (m === mode) {
          btn.className = "px-2.5 py-1 rounded-lg font-bold bg-slate-800 border border-slate-700 text-slate-100";
        } else {
          btn.className = "px-2.5 py-1 rounded-lg text-slate-400 hover:text-slate-200 transition-colors";
        }
      });

      const badge = document.getElementById('urgency-badge');
      if (mode === 'calm') badge.innerText = '14D CALM';
      else if (mode === 'focus') badge.innerText = '48H FOCUS';
      else if (mode === 'urgent') badge.innerText = '6H URGENT';
    }

    function toggleEditDrawer() {
      const drawer = document.getElementById('edit-drawer');
      drawer.classList.toggle('hidden');
    }

    function updateGoalConfig() {
      const title = document.getElementById('cfg-title').value.toUpperCase();
      document.getElementById('display-goal-title').innerText = title;

      document.getElementById('m1-text').innerText = `1. ${document.getElementById('cfg-m1').value}`;
      document.getElementById('m2-text').innerText = `2. ${document.getElementById('cfg-m2').value}`;
      document.getElementById('m3-text').innerText = `3. ${document.getElementById('cfg-m3').value}`;

      const target = new Date(document.getElementById('cfg-target').value);
      document.getElementById('display-target-sub').innerText = 
        `Target: ${target.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})} • ${target.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'})}`;
    }

    /* MILESTONE TOGGLES */
    function toggleMilestone(key) {
      milestones[key] = !milestones[key];
      const active = milestones[key];
      
      const pill = document.getElementById(`${key}-pill`);
      const check = document.getElementById(`${key}-check`);
      const status = document.getElementById(`${key}-status`);

      if (active) {
        pill.classList.add('bg-white/10', 'border-emerald-500/40');
        check.className = "w-4 h-4 rounded-full bg-emerald-500 text-slate-950 font-bold flex items-center justify-center text-[10px]";
        check.innerText = "✓";
        status.innerText = "Done";
        status.className = "text-[10px] font-mono text-emerald-400 font-semibold";
      } else {
        pill.classList.remove('bg-white/10', 'border-emerald-500/40');
        check.className = "w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center text-[10px]";
        check.innerText = "";
        status.innerText = "Pending";
        status.className = "text-[10px] font-mono text-slate-500";
      }

      // Calculate progress %
      const count = Object.values(milestones).filter(Boolean).length;
      const pct = Math.round((count / 3) * 100);
      document.getElementById('progress-bar-fill').style.width = `${pct}%`;
      document.getElementById('pct-label').innerText = `${pct}% Completed`;
    }

    /* HOLD TO FOCUS GESTURE */
    function startFocusHold() {
      document.body.classList.add('focus-active');
    }

    function endFocusHold() {
      document.body.classList.remove('focus-active');
    }

    /* 3:2 SUBMISSION COVER PNG EXPORTER (1500x1000) */
    function exportSubmissionCover() {
      const expCanvas = document.getElementById('exportCanvas');
      const ctx = expCanvas.getContext('2d');
      const width = 1500;
      const height = 1000;

      // 1. OLED Dark Background with radial ambient glow
      const accentColor = currentMode === 'calm' ? '#38bdf8' : (currentMode === 'urgent' ? '#f43f5e' : '#f59e0b');
      
      ctx.fillStyle = '#050507';
      ctx.fillRect(0, 0, width, height);

      const radGrad = ctx.createRadialGradient(width * 0.3, height * 0.5, 50, width * 0.3, height * 0.5, 600);
      radGrad.addColorStop(0, accentColor + '25');
      radGrad.addColorStop(1, '#050507');
      ctx.fillStyle = radGrad;
      ctx.fillRect(0, 0, width, height);

      // 2. Render Phone Mockup on Left (Scale: 360x760)
      const phoneX = 140;
      const phoneY = 120;
      const phoneW = 360;
      const phoneH = 760;

      // Phone Shadow
      ctx.shadowColor = accentColor;
      ctx.shadowBlur = 40;

      // Chassis
      ctx.fillStyle = '#050507';
      ctx.beginPath();
      ctx.roundRect(phoneX, phoneY, phoneW, phoneH, 44);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 6;
      ctx.stroke();

      // Lock Screen Header
      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 13px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('MONDAY, NOV 23', phoneX + phoneW/2, phoneY + 70);

      // Large Countdown Numbers inside mockup
      const d = document.getElementById('digit-days').innerText;
      const h = document.getElementById('digit-hours').innerText;
      const m = document.getElementById('digit-mins').innerText;
      const s = document.getElementById('digit-secs').innerText;

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 42px JetBrains Mono, monospace';
      ctx.fillText(`${d}d ${h}h ${m}m `, phoneX + phoneW/2 - 20, phoneY + 280);
      
      ctx.fillStyle = accentColor;
      ctx.fillText(`${s}s`, phoneX + phoneW/2 + 110, phoneY + 280);

      // Progress Bar inside mockup
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(phoneX + 60, phoneY + 330, 240, 6, 3);
      ctx.fill();

      const pctCount = Object.values(milestones).filter(Boolean).length;
      const pctVal = Math.round((pctCount / 3) * 100);
      ctx.fillStyle = accentColor;
      ctx.beginPath();
      ctx.roundRect(phoneX + 60, phoneY + 330, Math.max(12, 240 * (pctVal/100)), 6, 3);
      ctx.fill();

      // Goal Title
      ctx.fillStyle = '#f8fafc';
      ctx.font = '700 16px Plus Jakarta Sans, sans-serif';
      const titleText = document.getElementById('cfg-title').value.toUpperCase();
      ctx.fillText(titleText, phoneX + phoneW/2, phoneY + 390);

      ctx.fillStyle = '#64748b';
      ctx.font = '12px JetBrains Mono, monospace';
      ctx.fillText('Target: Nov 25, 2026 • 14:30 IST', phoneX + phoneW/2, phoneY + 415);

      // Render 3 Milestone Pills inside mockup
      const drawPill = (text, done, y) => {
        ctx.fillStyle = done ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)';
        ctx.beginPath();
        ctx.roundRect(phoneX + 40, y, 280, 42, 14);
        ctx.fill();
        ctx.strokeStyle = done ? 'rgba(16, 185, 129, 0.4)' : 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = done ? '#10b981' : '#64748b';
        ctx.font = 'bold 12px Inter, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(done ? '✓' : '○', phoneX + 56, y + 26);

        ctx.fillStyle = done ? '#f8fafc' : '#cbd5e1';
        ctx.font = '500 13px Inter, sans-serif';
        ctx.fillText(text, phoneX + 78, y + 26);
      };

      drawPill(`1. ${document.getElementById('cfg-m1').value}`, milestones.m1, phoneY + 470);
      drawPill(`2. ${document.getElementById('cfg-m2').value}`, milestones.m2, phoneY + 524);
      drawPill(`3. ${document.getElementById('cfg-m3').value}`, milestones.m3, phoneY + 578);

      // 3. Right Side: Clean Showcase Typography
      const rightX = 590;

      // Badge
      ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.beginPath();
      ctx.roundRect(rightX, 150, 240, 32, 16);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.stroke();

      ctx.fillStyle = accentColor;
      ctx.font = '700 12px JetBrains Mono, monospace';
      ctx.textAlign = 'left';
      ctx.fillText('✦ MINIMALIST LOCK SCREEN', rightX + 16, 171);

      // Title & Subtitle
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 46px Plus Jakarta Sans, sans-serif';
      ctx.fillText('MINIMAL DEADLINE', rightX, 245);
      ctx.fillText('LOCK SCREEN', rightX, 300);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '18px Inter, sans-serif';
      ctx.fillText('Sleek OLED countdown tracker with state-driven urgency colors', rightX, 340);

      // Specs Summary Box
      ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
      ctx.beginPath();
      ctx.roundRect(rightX, 390, 750, 360, 24);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.stroke();

      ctx.fillStyle = '#f8fafc';
      ctx.font = '700 18px Plus Jakarta Sans, sans-serif';
      ctx.fillText('Key Features & Milestone Tracking', rightX + 32, 435);

      const drawFeature = (num, title, desc, y) => {
        ctx.fillStyle = accentColor;
        ctx.font = '700 14px JetBrains Mono, monospace';
        ctx.fillText(num, rightX + 32, y);

        ctx.fillStyle = '#f1f5f9';
        ctx.font = '600 15px Plus Jakarta Sans, sans-serif';
        ctx.fillText(title, rightX + 64, y);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px Inter, sans-serif';
        ctx.fillText(desc, rightX + 64, y + 22);
      };

      drawFeature('01', 'OLED Color Shift System', 'Radial ambient backlight transitions from Sky Calm to Amber Focus & Coral Urgent.', 480);
      drawFeature('02', 'Glassmorphic Milestones', `Interactive progress pills: ${document.getElementById('cfg-m1').value} • ${document.getElementById('cfg-m2').value}`, 555);
      drawFeature('03', 'Hold-to-Focus Gesture', 'Fades all interface elements to present pure countdown numbers on pitch black OLED.', 630);

      // Footer
      ctx.fillStyle = '#475569';
      ctx.font = '13px JetBrains Mono, monospace';
      ctx.fillText('PROJECT SUBMISSION COVER • 3:2 ASPECT RATIO (1500x1000)', rightX, 810);

      // Trigger PNG Download
      const dataUrl = expCanvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'minimal-deadline-cover-3x2.png';
      link.href = dataUrl;
      link.click();
    }

    // Start timer loop on load
    window.onload = function() {
      updateCountdown();
    };
  </script>
</body>
</html>
